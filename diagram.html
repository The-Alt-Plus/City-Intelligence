<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITY INTELLIGENCE TOKYO · SYSTEM ARCHITECTURE PIPELINE</title>
    <!-- Tailwind CSS for clean technical HUD controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080808;
            color: #e5e5e5;
            font-family: 'JetBrains Mono', Consolas, monospace;
            overflow: hidden;
        }
        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #080808;
        }
        #diagram-viewport {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        svg#architecture-svg {
            width: 100%;
            height: 100%;
            max-width: 1680px;
            max-height: 920px;
            border: 1px solid #262626;
            border-radius: 10px;
            background: #080808;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }
        /* Animated data flow pulses */
        @keyframes pulseFlow {
            from { stroke-dashoffset: 36; }
            to { stroke-dashoffset: 0; }
        }
        .wire-pulse {
            stroke-dasharray: 6 12;
            animation: pulseFlow 1.1s linear infinite;
            pointer-events: none;
        }
        .paused-anim .wire-pulse {
            animation-play-state: paused;
            opacity: 0;
        }
        /* Interactive node styling */
        .arch-node {
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .arch-node rect.node-card {
            transition: stroke 0.2s ease, fill 0.2s ease, filter 0.2s ease;
        }
        .arch-node:hover rect.node-card {
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.55));
        }
        .dimmed {
            opacity: 0.22 !important;
        }
        .highlighted-wire {
            stroke-width: 2.5px !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- Top Header & Export Toolbar -->
    <header class="flex flex-wrap items-center justify-between gap-3 px-5 py-2.5 bg-neutral-950/95 border-b border-neutral-800/80 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-sm bg-[#dc2626] inline-block shadow-[0_0_8px_#dc2626]"></span>
            <div>
                <h1 class="text-xs sm:text-sm font-semibold tracking-widest text-neutral-100 uppercase">
                    CITY INTELLIGENCE TOKYO · SYSTEM ARCHITECTURE PIPELINE
                </h1>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <button id="btn-toggle-flow" class="px-3 py-1.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-700/80 text-[11px] text-red-400 transition">
                Data Flow: LIVE
            </button>
            <button id="btn-export-svg" class="px-3 py-1.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-700/80 text-[11px] text-neutral-200 transition">
                ↓ Export SVG
            </button>
            <button id="btn-export-png" class="px-3.5 py-1.5 rounded-lg bg-[#dc2626] hover:bg-[#ef4444] text-[11px] font-semibold text-white transition shadow-lg shadow-red-950/50">
                ↓ Export High-Res PNG
            </button>
        </div>
    </header>

    <!-- Main Deterministic Vector Diagram Stage -->
    <main id="diagram-viewport">
        <svg id="architecture-svg" viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Architectural Blueprint Micro-Grid -->
                <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141414" stroke-width="0.75"/>
                </pattern>
                <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
                    <rect width="100" height="100" fill="url(#minorGrid)"/>
                    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1f1f1f" stroke-width="1.1"/>
                </pattern>

                <!-- Arrowhead Markers -->
                <marker id="arrow-geo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#999999"/>
                </marker>
                <marker id="arrow-audio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
                </marker>
                <marker id="arrow-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ef4444"/>
                </marker>
                <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d4d4d4"/>
                </marker>
                <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f87171"/>
                </marker>
            </defs>

            <!-- Background Canvas Grid -->
            <rect width="1600" height="840" fill="#080808"/>
            <rect width="1600" height="840" fill="url(#majorGrid)"/>

            <!-- Top Technical Legend & Column Headers -->
            <g font-family="'JetBrains Mono', Consolas, monospace">
                <!-- Column 1 Header -->
                <text x="48" y="42" fill="#737373" font-size="10" font-weight="600" letter-spacing="1.5">01 // DATA ACQUISITION</text>
                <line x1="48" y1="50" x2="480" y2="50" stroke="#262626" stroke-width="1"/>

                <!-- Column 2 Header -->
                <text x="515" y="42" fill="#737373" font-size="10" font-weight="600" letter-spacing="1.5">02 // AUDIO-TO-MIDI BRIDGE</text>
                <line x1="515" y1="50" x2="775" y2="50" stroke="#262626" stroke-width="1"/>

                <!-- Column 3 Header -->
                <text x="815" y="42" fill="#ef4444" font-size="10" font-weight="700" letter-spacing="1.5">03 // RHINO + GRASSHOPPER COMPUTATIONAL ENGINE</text>
                <line x1="815" y1="50" x2="1275" y2="50" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1"/>

                <!-- Column 4 Header -->
                <text x="1310" y="42" fill="#737373" font-size="10" font-weight="600" letter-spacing="1.5">04 // DEPLOYMENT &amp; OUTPUTS</text>
                <line x1="1310" y1="50" x2="1555" y2="50" stroke="#262626" stroke-width="1"/>

                <!-- Stream Legend (Top Right) -->
                <g transform="translate(1035, 18)">
                    <circle cx="0" cy="4" r="3.5" fill="#999999"/>
                    <text x="10" y="8" fill="#a3a3a3" font-size="9.5">Geospatial XML/OSM</text>

                    <circle cx="135" cy="4" r="3.5" fill="#dc2626"/>
                    <text x="145" y="8" fill="#a3a3a3" font-size="9.5">4-Ch Audio / MIDI CC</text>

                    <line x1="278" y1="4" x2="298" y2="4" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <text x="305" y="8" fill="#a3a3a3" font-size="9.5">Direct Web Audio Link</text>
                </g>
            </g>

            <!-- ====================================================================== -->
            <!-- RHINO / GRASSHOPPER CORE BOUNDING CONTAINER (COLUMN 3)                  -->
            <!-- ====================================================================== -->
            <g id="gh-container">
                <rect x="810" y="135" width="470" height="635" rx="12" fill="#0d0d0d" stroke="#dc2626" stroke-width="1.6" stroke-opacity="0.75"/>
                <!-- Corner Registration Ticks -->
                <path d="M 810 155 L 810 135 L 830 135" fill="none" stroke="#ef4444" stroke-width="2.5"/>
                <path d="M 1260 135 L 1280 135 L 1280 155" fill="none" stroke="#ef4444" stroke-width="2.5"/>
                <path d="M 810 750 L 810 770 L 830 770" fill="none" stroke="#ef4444" stroke-width="2.5"/>
                <path d="M 1260 770 L 1280 770 L 1280 750" fill="none" stroke="#ef4444" stroke-width="2.5"/>

                <rect x="830" y="123" width="215" height="22" rx="4" fill="#1a0909" stroke="#dc2626" stroke-width="1"/>
                <text x="937" y="138" text-anchor="middle" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">
                    RHINO / GRASSHOPPER
                </text>

                <!-- Internal Sub-Zone Dividers inside GH -->
                <line x1="828" y1="455" x2="1262" y2="455" stroke="#262626" stroke-width="1" stroke-dasharray="4 4"/>
                <text x="835" y="446" fill="#525252" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">TOP BRANCH: GEOSPATIAL URBAN CONTEXT</text>
                <text x="835" y="470" fill="#525252" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">BOTTOM BRANCH: REAL-TIME MIDI &amp; ARTIFACT SYNTHESIS</text>
            </g>

            <!-- ====================================================================== -->
            <!-- ROUTING WIRES & ANIMATED PULSES (LAYERED BEHIND NODES)                  -->
            <!-- ====================================================================== -->
            <g id="wires-layer" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <!-- 1. A1 (OSM Area) -> C1 (Python XML/OSM Injector) -->
                <path id="wire-A1-C1" data-from="A1" data-to="C1"
                      d="M 475 215 C 620 215, 680 265, 835 265"
                      stroke="#999999" stroke-width="1.6" stroke-opacity="0.75" marker-end="url(#arrow-geo)"/>
                <path d="M 475 215 C 620 215, 680 265, 835 265" stroke="#e5e5e5" stroke-width="2" class="wire-pulse"/>

                <!-- 2. A2_raw (Google Maps) -> A2 (Google My Maps) -->
                <path id="wire-A2raw-A2" data-from="A2_raw" data-to="A2"
                      d="M 225 365 L 265 365"
                      stroke="#999999" stroke-width="1.6" stroke-opacity="0.75" marker-end="url(#arrow-geo)"/>

                <!-- 3. A2 (Google My Maps) -> C1 (Python XML/OSM Injector) -->
                <path id="wire-A2-C1" data-from="A2" data-to="C1"
                      d="M 475 365 C 620 365, 680 305, 835 305"
                      stroke="#999999" stroke-width="1.6" stroke-opacity="0.75" marker-end="url(#arrow-geo)"/>
                <path d="M 475 365 C 620 365, 680 305, 835 305" stroke="#e5e5e5" stroke-width="2" class="wire-pulse"/>

                <!-- 4. A3 (Ableton Push) -> B1 (Ableton Live) -->
                <path id="wire-A3-B1" data-from="A3" data-to="B1"
                      d="M 235 555 C 360 555, 410 585, 515 585"
                      stroke="#dc2626" stroke-width="1.6" stroke-opacity="0.8" marker-end="url(#arrow-audio)"/>
                <path d="M 235 555 C 360 555, 410 585, 515 585" stroke="#f87171" stroke-width="2" class="wire-pulse"/>

                <!-- 5. A4 (Cell Phone) -> A5 (Suno AI) -->
                <path id="wire-A4-A5" data-from="A4" data-to="A5"
                      d="M 225 685 L 265 685"
                      stroke="#dc2626" stroke-width="1.6" stroke-opacity="0.8" marker-end="url(#arrow-audio)"/>

                <!-- 6. A5 (Suno AI) -> B1 (Ableton Live) -->
                <path id="wire-A5-B1" data-from="A5" data-to="B1"
                      d="M 475 685 C 495 685, 495 630, 515 630"
                      stroke="#dc2626" stroke-width="1.6" stroke-opacity="0.8" marker-end="url(#arrow-audio)"/>
                <path d="M 475 685 C 495 685, 495 630, 515 630" stroke="#f87171" stroke-width="2" class="wire-pulse"/>

                <!-- 7. B1 (Ableton Live) -> B2 (loopMIDI) -->
                <path id="wire-B1-B2" data-from="B1" data-to="B2"
                      d="M 675 615 L 705 615"
                      stroke="#dc2626" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-audio)"/>

                <!-- 8. B2 (loopMIDI) -> C3 (Python Audio Data Capture) -->
                <path id="wire-B2-C3" data-from="B2" data-to="C3"
                      d="M 785 615 L 835 615"
                      stroke="#dc2626" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-audio)"/>
                <path d="M 785 615 L 835 615" stroke="#f87171" stroke-width="2.2" class="wire-pulse"/>

                <!-- 9. OVERHEAD DASHED FEEDBACK/AUDIO STREAM: B1 (Ableton Live) -> D1 (3D Web Viewer Area Map) -->
                <path id="wire-B1-D1" data-from="B1" data-to="D1"
                      d="M 595 545 L 595 92 L 1395 92 L 1395 235"
                      stroke="#f87171" stroke-width="1.6" stroke-dasharray="6 5" stroke-opacity="0.8" marker-end="url(#arrow-dashed)"/>
                <path d="M 595 545 L 595 92 L 1395 92 L 1395 235" stroke="#fecaca" stroke-width="2" class="wire-pulse"/>
                <rect x="915" y="80" width="250" height="20" rx="4" fill="#080808" stroke="#dc2626" stroke-opacity="0.55" stroke-width="0.8"/>
                <text x="1040" y="94" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5">
                    DIRECT AUDIO TRACK STREAM (.MP3 / .WAV)
                </text>

                <!-- 10. C1 (XML/OSM Injector) -> C2 (Audio Data Input to Area Map) -->
                <path id="wire-C1-C2" data-from="C1" data-to="C2"
                      d="M 1025 285 L 1068 285"
                      stroke="#999999" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-geo)"/>
                <path d="M 1025 285 L 1068 285" stroke="#e5e5e5" stroke-width="2" class="wire-pulse"/>

                <!-- 11. C3 (Audio Data Capture) -> C2 (Audio Data Input to Area Map) -->
                <path id="wire-C3-C2" data-from="C3" data-to="C2"
                      d="M 1025 585 C 1048 585, 1045 320, 1068 320"
                      stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-core)"/>
                <path d="M 1025 585 C 1048 585, 1045 320, 1068 320" stroke="#fca5a5" stroke-width="2" class="wire-pulse"/>

                <!-- 12. C3 (Audio Data Capture) -> C4 (Generative Script for Physical Artifact) -->
                <path id="wire-C3-C4" data-from="C3" data-to="C4"
                      d="M 1025 635 L 1068 635"
                      stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-core)"/>
                <path d="M 1025 635 L 1068 635" stroke="#fca5a5" stroke-width="2" class="wire-pulse"/>

                <!-- 13. C2 (Area Map) -> D1 (3D Web Viewer: Area Map) -->
                <path id="wire-C2-D1" data-from="C2" data-to="D1"
                      d="M 1255 295 L 1315 295"
                      stroke="#d4d4d4" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-out)"/>
                <path d="M 1255 295 L 1315 295" stroke="#ffffff" stroke-width="2" class="wire-pulse"/>

                <!-- 14. C4 (Generative Script) -> D2 (3D Web Viewer: Ring Artifact) -->
                <path id="wire-C4-D2" data-from="C4" data-to="D2"
                      d="M 1255 615 C 1285 615, 1285 485, 1315 485"
                      stroke="#d4d4d4" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arrow-out)"/>
                <path d="M 1255 615 C 1285 615, 1285 485, 1315 485" stroke="#ffffff" stroke-width="2" class="wire-pulse"/>

                <!-- 15. C4 (Generative Script) -> D4 (Digital Fabrication) -->
                <path id="wire-C4-D4" data-from="C4" data-to="D4"
                      d="M 1255 660 L 1315 660"
                      stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrow-core)"/>
                <path d="M 1255 660 L 1315 660" stroke="#fca5a5" stroke-width="2" class="wire-pulse"/>

                <!-- 16. D1 (3D Web Viewer 1) -> D3 (Notion Workspace) -->
                <path id="wire-D1-D3" data-from="D1" data-to="D3"
                      d="M 1455 295 C 1475 295, 1475 375, 1492 375"
                      stroke="#d4d4d4" stroke-width="1.6" stroke-opacity="0.8" marker-end="url(#arrow-out)"/>

                <!-- 17. D2 (3D Web Viewer 2) -> D3 (Notion Workspace) -->
                <path id="wire-D2-D3" data-from="D2" data-to="D3"
                      d="M 1455 485 C 1475 485, 1475 405, 1492 405"
                      stroke="#d4d4d4" stroke-width="1.6" stroke-opacity="0.8" marker-end="url(#arrow-out)"/>
            </g>

            <!-- ====================================================================== -->
            <!-- ARCHITECTURE NODES (ALL 4 COLUMNS)                                      -->
            <!-- ====================================================================== -->
            <g id="nodes-layer" font-family="'JetBrains Mono', Consolas, monospace">

                <!-- COLUMN 1: GEOSPATIAL & AUDIO ACQUISITION -->

                <!-- Node A1: OpenStreetMap -->
                <g class="arch-node" id="node-A1" data-id="A1"
                   data-title="A1 · OpenStreetMap (OSM) City Area"
                   data-tech="Export bounding box from openstreetmap.org or Overpass Turbo as raw .osm XML containing building footprints and street vectors.">
                    <rect class="node-card" x="265" y="165" width="210" height="96" rx="8" fill="#111111" stroke="#737373" stroke-width="1.3"/>
                    <rect x="265" y="165" width="210" height="22" rx="8" fill="#242424"/>
                    <text x="277" y="180" fill="#d4d4d4" font-size="9.5" font-weight="700">A1 · GEOSPATIAL BASE</text>
                    <text x="277" y="203" fill="#f5f5f5" font-size="11" font-weight="600">OpenStreetMap (OSM)</text>
                    <text x="277" y="220" fill="#a3a3a3" font-size="9.5">Defining Tokyo city area</text>
                    <text x="277" y="234" fill="#a3a3a3" font-size="9.5">&amp; downloading .osm file</text>
                    <text x="277" y="251" fill="#999999" font-size="8.5">FORMAT: .OSM (XML)</text>
                </g>

                <!-- Node A2_raw: Google Maps Locations -->
                <g class="arch-node" id="node-A2_raw" data-id="A2_raw"
                   data-title="A2a · Google Maps Field Pinning"
                   data-tech="Log exact GPS latitude/longitude coordinates on-site in Tokyo at each of the 4 acoustic recording points.">
                    <rect class="node-card" x="45" y="325" width="180" height="80" rx="8" fill="#111111" stroke="#666666" stroke-width="1.1"/>
                    <text x="57" y="346" fill="#d4d4d4" font-size="9" font-weight="700">A2a · FIELD GPS LOG</text>
                    <text x="57" y="365" fill="#f5f5f5" font-size="10.5" font-weight="600">Google Maps</text>
                    <text x="57" y="380" fill="#a3a3a3" font-size="9.5">Locations of field</text>
                    <text x="57" y="393" fill="#a3a3a3" font-size="9.5">audio recordings</text>
                </g>

                <!-- Node A2: Google My Maps Tagged XML -->
                <g class="arch-node" id="node-A2" data-id="A2"
                   data-title="A2b · Google My Maps Tagged Locations"
                   data-tech="Organize pins into a custom Google My Maps layer, attach metadata tags (CH1–CH4, dB, location name), and export as KML/XML.">
                    <rect class="node-card" x="265" y="315" width="210" height="100" rx="8" fill="#111111" stroke="#737373" stroke-width="1.3"/>
                    <rect x="265" y="315" width="210" height="22" rx="8" fill="#242424"/>
                    <text x="277" y="330" fill="#d4d4d4" font-size="9.5" font-weight="700">A2b · TAGGED PINS</text>
                    <text x="277" y="352" fill="#f5f5f5" font-size="11" font-weight="600">Google My Maps</text>
                    <text x="277" y="369" fill="#a3a3a3" font-size="9.5">Adding specific metadata</text>
                    <text x="277" y="383" fill="#a3a3a3" font-size="9.5">tags to each location</text>
                    <text x="277" y="402" fill="#999999" font-size="8.5">EXPORT: .KML / .XML</text>
                </g>

                <!-- Node A3: Audio Recordings with Ableton Push -->
                <g class="arch-node" id="node-A3" data-id="A3"
                   data-title="A3 · Hardware Field Capture (Ableton Push)"
                   data-tech="Direct multi-track environmental and rhythmic sampling recorded in Tokyo via Ableton Push hardware.">
                    <rect class="node-card" x="45" y="510" width="190" height="88" rx="8" fill="#140b0b" stroke="#dc2626" stroke-width="1.3"/>
                    <rect x="45" y="510" width="190" height="22" rx="8" fill="#2e1010"/>
                    <text x="57" y="525" fill="#f87171" font-size="9.5" font-weight="700">A3 · HARDWARE AUDIO</text>
                    <text x="57" y="548" fill="#f5f5f5" font-size="11" font-weight="600">Ableton Push</text>
                    <text x="57" y="565" fill="#a3a3a3" font-size="9.5">Field audio recordings</text>
                    <text x="57" y="584" fill="#ef4444" font-size="8.5">DIRECT STEM CAPTURE</text>
                </g>

                <!-- Node A4: Audio Recordings with Cell Phone -->
                <g class="arch-node" id="node-A4" data-id="A4"
                   data-title="A4 · Mobile Field Capture (Cell Phone)"
                   data-tech="On-site ambient voice/sound capture recorded via smartphone at Tokyo street nodes.">
                    <rect class="node-card" x="45" y="645" width="180" height="80" rx="8" fill="#140b0b" stroke="#b91c1c" stroke-width="1.1"/>
                    <text x="57" y="666" fill="#f87171" font-size="9" font-weight="700">A4 · MOBILE CAPTURE</text>
                    <text x="57" y="685" fill="#f5f5f5" font-size="10.5" font-weight="600">Cell Phone</text>
                    <text x="57" y="700" fill="#a3a3a3" font-size="9.5">Ambient field audio</text>
                    <text x="57" y="713" fill="#a3a3a3" font-size="9.5">recordings (.wav/.m4a)</text>
                </g>

                <!-- Node A5: Tracks made in Suno -->
                <g class="arch-node" id="node-A5" data-id="A5"
                   data-title="A5 · Generative AI Audio (Suno)"
                   data-tech="Phone field recordings are uploaded as audio prompts into Suno to synthesize harmonic/rhythmic companion stems.">
                    <rect class="node-card" x="265" y="640" width="210" height="90" rx="8" fill="#140b0b" stroke="#dc2626" stroke-width="1.3"/>
                    <rect x="265" y="640" width="210" height="22" rx="8" fill="#2e1010"/>
                    <text x="277" y="655" fill="#f87171" font-size="9.5" font-weight="700">A5 · AI SYNTHESIS</text>
                    <text x="277" y="677" fill="#f5f5f5" font-size="11" font-weight="600">Tracks Made in Suno</text>
                    <text x="277" y="694" fill="#a3a3a3" font-size="9.5">Synthesized based on</text>
                    <text x="277" y="708" fill="#a3a3a3" font-size="9.5">cell phone recordings</text>
                </g>

                <!-- COLUMN 2: AUDIO-TO-MIDI BRIDGE -->

                <!-- Node B1: Ableton Live -->
                <g class="arch-node" id="node-B1" data-id="B1"

            <span id="inspector-desc" class="text-neutral-400 truncate hidden md:inline">Includes Python XML/OSM merger, real-time loopMIDI listener, dual 3D Web Viewers, and Digital Fabrication outputs.</span>

<!-- Non-blocking Toast Notification -->
<div id="toast-box" class="fixed top-16 right-6 z-50 hidden px-4 py-2 rounded-lg bg-neutral-900/95 border border-neutral-700 text-xs text-neutral-200 shadow-2xl">
    <span id="toast-msg">Exported</span>
</div>

<script>
(function () {
    const svgEl = document.getElementById("architecture-svg");
    const nodes = Array.from(document.querySelectorAll(".arch-node"));
    const wires = Array.from(document.querySelectorAll("#wires-layer path[data-from]"));

    const inspectorTitle = document.getElementById("inspector-title");
    const inspectorDesc = document.getElementById("inspector-desc");
    const btnResetFocus = document.getElementById("btn-reset-focus");
    const btnToggleFlow = document.getElementById("btn-toggle-flow");
    const btnExportSvg = document.getElementById("btn-export-svg");
    const btnExportPng = document.getElementById("btn-export-png");
    const toastBox = document.getElementById("toast-box");
    const toastMsg = document.getElementById("toast-msg");

    let lockedNodeId = null;
    let isFlowAnimating = true;

    function showToast(msg) {
        toastMsg.textContent = msg;
        toastBox.classList.remove("hidden");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
            toastBox.classList.add("hidden");
        }, 3200);
    }

    // Build adjacency map for highlighting connected upstream/downstream paths
    function focusNode(targetId) {
        if (!targetId) {
            nodes.forEach((n) => n.classList.remove("dimmed"));
            wires.forEach((w) => {
                w.classList.remove("dimmed", "highlighted-wire");
            });
            inspectorTitle.textContent = "Hover or click any module to trace upstream/downstream data dependencies";
            inspectorDesc.textContent = "Includes Python XML/OSM merger, real-time loopMIDI listener, dual 3D Web Viewers, and Digital Fabrication outputs.";
            btnResetFocus.classList.add("hidden");
            return;
        }

        const connectedNodes = new Set([targetId]);
        const connectedWires = new Set();

        wires.forEach((w) => {
            const from = w.getAttribute("data-from");
            const to = w.getAttribute("data-to");
            if (from === targetId || to === targetId) {
                connectedWires.add(w);
                connectedNodes.add(from);
                connectedNodes.add(to);
            }
        });

        nodes.forEach((n) => {
            const id = n.getAttribute("data-id");
            if (connectedNodes.has(id)) {
                n.classList.remove("dimmed");
            } else {
                n.classList.add("dimmed");
            }
        });

        wires.forEach((w) => {
            if (connectedWires.has(w)) {
                w.classList.remove("dimmed");
                w.classList.add("highlighted-wire");
            } else {
                w.classList.add("dimmed");
                w.classList.remove("highlighted-wire");
            }
        });

        const activeEl = document.getElementById(`node-${targetId}`);
        if (activeEl) {
            inspectorTitle.textContent = activeEl.getAttribute("data-title");
            inspectorDesc.textContent = activeEl.getAttribute("data-tech");
        }
        if (lockedNodeId) {
            btnResetFocus.classList.remove("hidden");
        }
    }

    nodes.forEach((node) => {
        const id = node.getAttribute("data-id");
        node.addEventListener("mouseenter", () => {
            if (!lockedNodeId) focusNode(id);
        });
        node.addEventListener("mouseleave", () => {
            if (!lockedNodeId) focusNode(null);
        });
        node.addEventListener("click", (e) => {
            e.stopPropagation();
            if (lockedNodeId === id) {
                lockedNodeId = null;
                focusNode(null);
            } else {
                lockedNodeId = id;
                focusNode(id);
            }
        });
    });

    svgEl.addEventListener("click", () => {
        if (lockedNodeId) {
            lockedNodeId = null;
            focusNode(null);
        }
    });

    btnResetFocus.addEventListener("click", () => {
        lockedNodeId = null;
        focusNode(null);
    });

    btnToggleFlow.addEventListener("click", () => {
        isFlowAnimating = !isFlowAnimating;
        svgEl.classList.toggle("paused-anim", !isFlowAnimating);
        btnToggleFlow.textContent = isFlowAnimating ? "Data Flow: LIVE" : "Data Flow: STATIC";
        btnToggleFlow.classList.toggle("text-red-400", isFlowAnimating);
        btnToggleFlow.classList.toggle("text-neutral-400", !isFlowAnimating);
    });

    // ============================================================================
    // DETERMINISTIC HIGH-RES SVG & PNG EXPORT FOR NOTION / PRESENTATIONS
    // ============================================================================
    function getCleanSerializedSVG() {
        const clone = svgEl.cloneNode(true);
        clone.setAttribute("width", "3200");
        clone.setAttribute("height", "1680");
        // Strip transient interactive dimming or animation overlays for crisp static print/Notion image
        clone.querySelectorAll(".wire-pulse").forEach((el) => el.remove());
        clone.querySelectorAll(".dimmed").forEach((el) => el.classList.remove("dimmed"));
        const serializer = new XMLSerializer();
        let source = serializer.serializeToString(clone);
        if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        return '<?xml version="1.0" standalone="no"?>\r\n' + source;
    }

    btnExportSvg.addEventListener("click", () => {
        try {
            const svgData = getCleanSerializedSVG();
            const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "tokyo_system_architecture_diagram.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Downloaded deterministic vector SVG: tokyo_system_architecture_diagram.svg");
        } catch (err) {
            showToast("SVG export error.");
        }
    });

    btnExportPng.addEventListener("click", () => {
        try {
            const svgData = getCleanSerializedSVG();
            const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.onload = function () {
                const exportCanvas = document.createElement("canvas");
                exportCanvas.width = 3200; // 2x Retina 1600x840 resolution
                exportCanvas.height = 1680;
                const eCtx = exportCanvas.getContext("2d");
                eCtx.fillStyle = "#080808";
                eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                eCtx.drawImage(img, 0, 0, exportCanvas.width, exportCanvas.height);

                exportCanvas.toBlob((pngBlob) => {
                    const pngUrl = URL.createObjectURL(pngBlob);
                    const a = document.createElement("a");
                    a.href = pngUrl;
                    a.download = "tokyo_system_architecture_diagram_3200px.png";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(pngUrl);
                    URL.revokeObjectURL(url);
                    showToast("Downloaded 3200×1680px PNG ready for Notion /embed or /image.");
                }, "image/png");
            };
            img.src = url;
        } catch (err) {
            showToast("PNG export error.");
        }
    });
})();
</script>
